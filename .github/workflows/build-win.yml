name: Build Windows EXE

# 在 GitHub 的 Windows 机器上原生构建 .exe，无需自己有 Windows 电脑。
# 触发：手动 (Actions 页面 Run workflow) 或推送 v* 标签。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    # 把 Chromium 内核装到项目根的 pw-browsers/，再由 electron-builder 的 extraResources
    # 复制到安装包的 resources/pw-browsers（asar 外，可执行）。用户机器无需再装浏览器。
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\pw-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      # 校验内核确实装进了 pw-browsers，避免打出「空壳」包
      - name: Verify Chromium bundled
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter chrome.exe "$env:GITHUB_WORKSPACE\pw-browsers" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "chrome.exe not found in pw-browsers"; exit 1 }
          Write-Host "OK: $($exe.FullName)"

      - name: Build & package (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: douyin-auto-win
          path: release/*.exe
