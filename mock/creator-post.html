<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>抖音创作者中心 · 发布视频（本地 MOCK）</title>
  <style>
    * { box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    body { margin:0; background:#f4f6fa; color:#2b303b; }
    .bar { background:#fe2c55; color:#fff; padding:10px 20px; font-weight:700; display:flex; align-items:center; gap:10px; }
    .badge { background:#fff; color:#fe2c55; border-radius:20px; padding:2px 10px; font-size:12px; }
    .wrap { max-width:760px; margin:24px auto; background:#fff; border:1px solid #e6e9f0; border-radius:14px; padding:24px; }
    h2 { margin:0 0 18px; font-size:18px; }
    .field { margin-bottom:20px; }
    .label { font-size:13px; color:#8a92a6; margin-bottom:8px; }
    .drop { border:2px dashed #d4d9e3; border-radius:12px; padding:30px; text-align:center; color:#8a92a6; }
    .drop.has { border-color:#21ba72; color:#21ba72; background:#f3fbf6; }
    input[type=text] { width:100%; border:1px solid #e6e9f0; border-radius:8px; padding:10px 12px; font-size:14px; }
    .editor-kit-container { min-height:64px; border:1px solid #e6e9f0; border-radius:8px; padding:10px 12px; font-size:14px; }
    .editor-kit-container:empty::before { content:"添加作品简介、话题…"; color:#b7bccb; }
    .status { font-size:13px; margin-top:8px; }
    .up-ok { color:#21ba72; font-weight:600; }
    .pub-ok { margin-top:18px; padding:14px; background:#eef9f1; color:#21ba72; border-radius:10px; font-weight:700; text-align:center; }
    button.publish { margin-top:18px; background:#fe2c55; color:#fff; border:none; border-radius:10px; padding:12px 28px; font-size:15px; cursor:pointer; }
    .meta { font-size:12px; color:#b7bccb; margin-top:24px; text-align:center; }
  </style>
</head>
<body>
  <div class="bar">抖音创作者中心 · 发布视频 <span class="badge">本地 MOCK 页面</span></div>
  <div class="wrap">
    <h2>发布视频</h2>

    <div class="field">
      <div class="label">视频文件</div>
      <label class="drop" id="drop">
        <input type="file" id="file" style="display:none" accept="video/*" />
        <div id="dropText">点击或拖拽上传视频（自动化会用 setInputFiles 注入）</div>
      </label>
      <div class="status" id="upStatus"></div>
    </div>

    <div class="field">
      <div class="label">作品标题</div>
      <input type="text" id="title" placeholder="填写作品标题，可以更好地被推荐" />
    </div>

    <div class="field">
      <div class="label">简介 / 话题</div>
      <div class="editor-kit-container" contenteditable="true" id="caption"></div>
    </div>

    <button class="publish" id="publish">发布作品</button>
    <div id="pubResult"></div>

    <div class="meta">这是一个完全本地的假页面，用于测试自动化编排（上传 / 填表 / 发布检测），不联网、不碰真实抖音。</div>
  </div>

  <script>
    const file = document.getElementById('file')
    const drop = document.getElementById('drop')
    const dropText = document.getElementById('dropText')
    const upStatus = document.getElementById('upStatus')
    file.addEventListener('change', () => {
      const f = file.files[0]
      if (!f) return
      drop.classList.add('has')
      dropText.textContent = '📹 ' + f.name + '（' + f.size + ' bytes）'
      upStatus.textContent = '上传中…'
      setTimeout(() => { upStatus.innerHTML = '<span class="up-ok">上传成功</span>' }, 1200)
    })
    document.getElementById('publish').addEventListener('click', () => {
      document.getElementById('pubResult').innerHTML =
        '<div class="pub-ok">发布成功 ✓ 标题：「' + (document.getElementById('title').value || '（空）') + '」</div>'
    })
  </script>
</body>
</html>
