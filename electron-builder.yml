appId: com.example.douyin-auto
productName: 抖音自动化工具
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# 原生模块 / playwright 不能压进 asar，需解包
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/playwright/**"
  - "**/node_modules/playwright-core/**"

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
