appId: com.example.douyin-auto
productName: 抖音自动化工具
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# 原生模块 / playwright 不能压进 asar，需解包
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/playwright/**"
  - "**/node_modules/playwright-core/**"

# 把 Chromium 内核放到 asar 外的 resources/pw-browsers（asar 里的 exe 无法执行）。
# 构建前需把内核装到项目根的 pw-browsers/ 目录（见 CI workflow / 本地构建说明）。
# 运行时 automation.js 会把 PLAYWRIGHT_BROWSERS_PATH 指向 resources/pw-browsers。
extraResources:
  - from: pw-browsers
    to: pw-browsers
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
